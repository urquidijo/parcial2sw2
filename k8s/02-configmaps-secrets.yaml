apiVersion: v1
kind: ConfigMap
metadata:
  name: habitat-config
  namespace: habitat-pro
data:
  NODE_ENV: "production"
  PORT: "5000"
  BFF_PORT: "4000"
  PROPERTIES_SVC: "http://ms-properties-svc:3001/api/v1/properties"
  CONTRACTS_SVC: "http://ms-contracts-svc:8081/api/v1"
  BILLING_SVC: "http://ms-billing-svc:8002/api/v1"
  ML_SVC: "http://ms-ml-svc:8003/api/v1/ml"
  BFF_URL: "http://bff-graphql-svc:4000/"
  KEYCLOAK_ISSUER_URI: "https://keycloak-production-f968.up.railway.app/realms/habitat"
  AWS_REGION: "us-east-1"
  S3_BUCKET: "sw2p2"
---
apiVersion: v1
kind: Secret
metadata:
  name: habitat-secrets
  namespace: habitat-pro
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "AKIA_DEMO_HABITAT_K8S"
  AWS_SECRET_ACCESS_KEY: "SECRET_KEY_DEMO_HABITAT_K8S"
  KEYCLOAK_ADMIN_CLIENT_SECRET: "habitat-admin-prod-secret"
  KEYCLOAK_MONITOR_CLIENT_SECRET: "habitat-monitor-prod-secret"

