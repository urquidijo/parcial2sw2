apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-billing-deployment
  namespace: habitat-pro
  labels:
    app: ms-billing
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-billing
  template:
    metadata:
      labels:
        app: ms-billing
    spec:
      containers:
        - name: ms-billing
          image: josue/habitat-ms-billing:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          envFrom:
            - configMapRef:
                name: habitat-config
            - secretRef:
                name: habitat-secrets
          resources:
            requests:
              cpu: "80m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "384Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ms-billing-svc
  namespace: habitat-pro
  labels:
    app: ms-billing
spec:
  type: ClusterIP
  selector:
    app: ms-billing
  ports:
    - protocol: TCP
      port: 8002
      targetPort: 8002

