apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-properties-deployment
  namespace: habitat-pro
  labels:
    app: ms-properties
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-properties
  template:
    metadata:
      labels:
        app: ms-properties
    spec:
      containers:
        - name: ms-properties
          image: josue/habitat-ms-properties:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: habitat-config
            - secretRef:
                name: habitat-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/properties
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/properties
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ms-properties-svc
  namespace: habitat-pro
  labels:
    app: ms-properties
spec:
  type: ClusterIP
  selector:
    app: ms-properties
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001

