apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-contracts-deployment
  namespace: habitat-pro
  labels:
    app: ms-contracts
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-contracts
  template:
    metadata:
      labels:
        app: ms-contracts
    spec:
      containers:
        - name: ms-contracts
          image: josue/habitat-ms-contracts:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: habitat-config
            - secretRef:
                name: habitat-secrets
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "600m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/architecture
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/architecture
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ms-contracts-svc
  namespace: habitat-pro
  labels:
    app: ms-contracts
spec:
  type: ClusterIP
  selector:
    app: ms-contracts
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081

