"""
BFF GraphQL del Sistema de Gestión Empresarial (ERP) de Habitat Pro.
Une en una sola consulta datos de ms-contracts (PostgreSQL) y ms-properties (MongoDB).
"""

enum ContractType {
  PROMESA_COMPRAVENTA
  ARRENDAMIENTO
  EXCLUSIVIDAD_VENTA
  RESERVA_CON_ARRAS
}

enum ContractStatus {
  BORRADOR
  PENDIENTE_FIRMA
  FIRMADO
  CANCELADO
  RECHAZADO
}

enum Sector {
  AGENTE
  LEGAL
  FINANZAS
  ATENCION
}

enum AppointmentStatus {
  CONFIRMADA
  COMPLETADA
  CANCELADA
}

type Property {
  id: ID!
  code: String!
  title: String!
  propertyType: String
  status: String
  price: Float
  city: String
  zone: String
  address: String
  areaSquareMeters: Float
  rooms: Int
  bathrooms: Int
  image: String
}

type Signature {
  signerName: String!
  signerRole: String!
  documentHash: String!
  signedAt: String!
}

type Contract {
  id: ID!
  contractNumber: String!
  contractType: ContractType!
  status: ContractStatus!
  propertyId: String!
  propertyTitle: String
  "Inmueble completo desde ms-properties (resuelto sin N+1)"
  property: Property
  clientId: String!
  clientName: String
  agentId: String
  totalAmount: Float!
  downPayment: Float!
  legalClauses: String
  cancellationReason: String
  signedBy: String
  signatures: [Signature!]!
  signaturesRequired: Int!
  createdAt: String
}

type Employee {
  id: ID!
  name: String!
  email: String!
  sector: Sector
  active: Boolean!
  createdAt: String
}

type Client {
  id: ID!
  name: String!
  email: String!
}

type Appointment {
  id: ID!
  propertyId: String
  propertyTitle: String
  property: Property
  userId: String
  clientName: String
  clientPhone: String
  visitDate: String!
  visitTime: String!
  visitType: String
  notes: String
  status: AppointmentStatus!
}

input CreateContractInput {
  propertyId: String!
  propertyTitle: String
  clientId: String!
  clientName: String
  contractType: ContractType!
  totalAmount: Float!
  downPayment: Float!
  legalClauses: String
}

input CreateEmployeeInput {
  firstName: String!
  lastName: String!
  email: String!
  sector: Sector!
  temporaryPassword: String!
}

type Query {
  "CU11/CU12: contratos (el cliente recibe solo los suyos)"
  contracts(status: ContractStatus): [Contract!]!
  contract(id: ID!): Contract
  "CU08: empleados (solo ADMIN)"
  employees: [Employee!]!
  "Clientes para generar contratos (LEGAL / ADMIN / AGENTE)"
  clients: [Client!]!
  "CU09/CU10: agenda de visitas"
  appointments(status: AppointmentStatus): [Appointment!]!
  "Catálogo de inmuebles"
  properties(status: String): [Property!]!
}

type Mutation {
  createContract(input: CreateContractInput!): Contract!
  cancelContract(id: ID!, reason: String!): Contract!
  signContract(id: ID!): Contract!
  createEmployee(input: CreateEmployeeInput!): Employee!
  updateEmployeeSector(id: ID!, sector: Sector!): Employee!
  setEmployeeActive(id: ID!, active: Boolean!): Employee!
  updateAppointmentStatus(id: ID!, status: AppointmentStatus!): Appointment!
}
