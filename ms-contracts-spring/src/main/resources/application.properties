# Configuración del Servidor (Soporta variable PORT dinámica de Railway/Cloud)
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8081}

# Configuración de Base de Datos PostgreSQL en Render (Nube)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA & Hibernate (auto-crea y actualiza tablas en PostgreSQL Render)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.com.proptech.contracts=INFO
logging.level.org.hibernate.SQL=DEBUG

# SSO: validación de tokens emitidos por Keycloak (realm habitat)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/habitat}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8080/realms/habitat/protocol/openid-connect/certs}

# Cuenta de servicio para la API de administración de Keycloak (gestión de empleados, CU08)
keycloak.admin.base-url=${KEYCLOAK_URL:http://localhost:8080}
keycloak.admin.realm=${KEYCLOAK_REALM:habitat}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:habitat-admin-api}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:habitat-admin-dev-secret}
