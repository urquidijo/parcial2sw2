spring.datasource.url=${SPRING_DATASOURCE_URL:${POSTGRES_URL:jdbc:postgresql://dpg-dbaffmbbc2fs73b71ei0-a.oregon-postgres.render.com:5432/bdsw2?sslmode=require}}
